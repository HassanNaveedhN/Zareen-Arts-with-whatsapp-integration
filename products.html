<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"><meta name="viewport"
            content="width=device-width,initial-scale=1.0">
        <title>Shop | Zareen Arts</title>
        <link rel="stylesheet"
            href="css/style.css">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    </head>
    <body>
        <header class="site-header">
            <a class="logo" href="index.html">Zareen <span>Arts</span></a>
            <nav><a href="index.html">Home</a><a
                    href="products.html?cat=cakes">Cakes</a><a
                    href="products.html?cat=resin">Resin Art</a></nav>
            <a class="cart-link" href="cart.html">Cart <span
                    id="cart-count">0</span></a>
        </header>
        <main class="section shop-page">
            <p class="eyebrow">ZAREEN ARTS</p><h1>Our Collection</h1>
            <div class="shop-toolbar"><input id="search"
                    placeholder="Search products..."><select
                    id="category"><option value="all">All
                        Categories</option><option
                        value="cakes">Cakes</option><option value="resin">Resin
                        Art</option></select></div>
            <div id="all-products" class="product-grid"></div>
        </main>
        <script src="js/products.js"></script><script src="js/app.js"></script>
    </body></html>
